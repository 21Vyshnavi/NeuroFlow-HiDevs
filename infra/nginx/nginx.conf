# =============================================================================
# NeuroFlow — Production Nginx configuration
# Features:
#   - Upstream load balancing across two API replicas
#   - Rate limiting (60 req/min per IP) → 429 on excess
#   - Gzip compression
#   - Security headers (CSP, HSTS, X-Frame-Options, …)
#   - SSL termination (self-signed for dev; swap for Let's Encrypt in prod)
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens  off;   # hide Nginx version

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Rate limiting
    # Zone "api": 10 MB shared memory, 60 requests/minute per client IP.
    # Excess requests return 429 (Too Many Requests).
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # Upstream — two API replicas (scaled via docker-compose replicas)
    # Docker resolves "api" to both containers automatically.
    # -------------------------------------------------------------------------
    upstream neuroflow_api {
        least_conn;                  # route to replica with fewest active connections
        server api:8000;             # Docker will round-robin DNS to both replicas
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Upstream — Next.js frontend
    # -------------------------------------------------------------------------
    upstream neuroflow_frontend {
        server frontend:80;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Allow health checks without redirect (for Docker / K8s probes)
        location /health {
            proxy_pass http://neuroflow_api/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS — main server block
    # Replace cert paths with your Let's Encrypt paths in production:
    #   ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS certificates (self-signed for dev; swap in prod)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Modern TLS settings
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        # -----------------------------------------------------------------------
        # Security headers
        # -----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                          always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header X-XSS-Protection          "1; mode=block"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

        # -----------------------------------------------------------------------
        # API routes — rate limited, proxied to API replicas
        # -----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://neuroflow_api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE / streaming support
            proxy_read_timeout    3600s;
            proxy_buffering       off;
            proxy_cache           off;
        }

        # Direct backend health endpoint (no rate limiting)
        location /health {
            proxy_pass         http://neuroflow_api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # -----------------------------------------------------------------------
        # Frontend — static files & Next.js SSR
        # -----------------------------------------------------------------------
        location / {
            proxy_pass         http://neuroflow_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Next.js static assets — long cache
        location /_next/static/ {
            proxy_pass         http://neuroflow_frontend/_next/static/;
            expires            365d;
            add_header         Cache-Control "public, immutable";
        }
    }
}
