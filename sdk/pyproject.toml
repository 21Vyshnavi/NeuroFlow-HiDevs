[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroflow-sdk"
version = "0.1.0"
description = "Python SDK for NeuroFlow - Multi-Modal LLM Orchestration Platform"
authors = [{name = "NeuroFlow Team"}]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0"
]
readme = "README.md"
requires-python = ">=3.11"
