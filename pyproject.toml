[project]
name = "neuroflow"
version = "2.1.0"
description = "Production Multi-Modal LLM Orchestration Platform with RAG, Fine-Tuning & Real-Time Evaluation"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests requiring services",
]

[tool.coverage.run]
source = ["backend", "pipelines"]
omit = ["*/__pycache__/*", "*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 40
